org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=100
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
# JDK 17 is required for AGP 8.4 (system default may be newer)
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk

# KSP configuration (replaces kapt for Room/Hilt)
ksp.version=1.9.23-1.0.19

# Ollama binary configuration - using v0.1.47 which provides raw ARM64 binary
ollamaVersion=0.1.47
ollamaBinaryUrl=https://github.com/ollama/ollama/releases/download/v0.1.47/ollama-linux-arm64
ollamaBinarySha256=8d27bf2c8bcefdaeaf4d1f29019182d568dfb25ed62ec7c2b87aa1a2cedac321
