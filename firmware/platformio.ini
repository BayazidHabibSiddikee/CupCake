; CupCake companion firmware
; Shared dependencies for every target.
[common_libs]
lib_deps =
  olikraus/U8g2@^2.36.0
  madhephaestus/ESP32Servo@^3.0.0
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.0

[build]
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1

; ---- production board (ESP32-S3) -------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
  ${build.build_flags}
  -DBOARD_HAS_PSRAM=
lib_deps = ${common_libs.lib_deps}

; ---- dev/test board (plain ESP32, CH340) ------------------------------------
; I2C stays on the chip defaults (SDA=21, SCL=22); battery tap moves to
; GPIO34 (ADC1-only); reserved neck servo pin moves to GPIO13.
; huge_app: BLE + WiFi stacks are big, and daily dev needs no OTA slot.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_flags = ${build.build_flags}
lib_deps = ${common_libs.lib_deps}
