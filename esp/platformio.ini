; PlatformIO Configuration for ESP32-S3
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition table: 4MB flash with OTA
board_build.partitions = huge_app.csv

; Build flags
build_flags = 
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Iinclude

; Compiler optimization
build_unflags = -Os
build_flags += -O2

; Linker script for PSRAM
board_build.ldscript = esp32s3_out.ld

; Libraries
lib_deps = 
  h2zero/NimBLE-Arduino@^2.0.0
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit BusIO@^1.14.0
  adafruit/Adafruit Unified Sensor@^1.1.9
  adafruit/Adafruit MPU6050@^2.2.6

; Library storage mode
lib_ldf_mode = chain+

; Custom partitions (huge_app.csv)
; # Name,   Type, SubType, Offset,  Size, Flags
; nvs,      data, nvs,     0x9000,  0x6000,
; phy_init, data, phy,     0xf000,  0x1000,
; factory,  app,  factory, 0x10000, 1M,
; ota_0,    app,  ota_0,   ,        1M,
; ota_1,    app,  ota_1,   ,        1M,
; ota_data, data, ota,     ,        0x2000,
; spiffs,   data, spiffs,  ,        1M,
; coredump, data, coredump,,        0x40000,

; Monitor filters
monitor_filters = 
  esp32_exception_decoder
  time

; Test configuration
test_framework = unity
test_build_flags = -DUNITY_INCLUDE_CONFIG_H

; OTA configuration
upload_protocol = espota
upload_port = 192.168.1.100

; Debug (requires JTAG)
debug_tool = esp-prog
debug_init_break = tbreak setup

; ---------------------------------------------------------------------------
; Classic ESP32 (ESP32-D0WD-V3, 4MB) — used for the BLE WiFi provisioning test.
; Uses the pioarduino platform (Arduino core 3.x / IDF 5.x) so NimBLE-Arduino
; 2.x compiles. I2C is moved to the safe 21/22 pins (6-11 are wired to flash).
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

board_build.partitions = huge_app.csv

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DI2C_SDA_PIN=21
  -DI2C_SCL_PIN=22
  -Iinclude
  -O2

lib_deps =
  h2zero/NimBLE-Arduino@^2.0.0
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit BusIO@^1.14.0
  adafruit/Adafruit Unified Sensor@^1.1.9
  adafruit/Adafruit MPU6050@^2.2.6

lib_ldf_mode = chain+

monitor_filters =
  esp32_exception_decoder
  time