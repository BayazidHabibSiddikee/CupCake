; PlatformIO Configuration for ESP32-S3
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition table: 4MB flash with OTA
board_build.partitions = huge_app.csv

; Build flags
build_flags = 
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Iinclude

; Compiler optimization
build_unflags = -Os
build_flags += -O2

; Linker script for PSRAM
board_build.ldscript = esp32s3_out.ld

; Libraries
lib_deps = 
  nimble-arduino/NimBLE-Arduino@^2.0.0
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit BusIO@^1.14.0
  adafruit/Adafruit Unified Sensor@^1.1.9
  adafruit/Adafruit MPU6050@^2.3.0

; Library storage mode
lib_ldf_mode = chain+

; Custom partitions (huge_app.csv)
; # Name,   Type, SubType, Offset,  Size, Flags
; nvs,      data, nvs,     0x9000,  0x6000,
; phy_init, data, phy,     0xf000,  0x1000,
; factory,  app,  factory, 0x10000, 1M,
; ota_0,    app,  ota_0,   ,        1M,
; ota_1,    app,  ota_1,   ,        1M,
; ota_data, data, ota,     ,        0x2000,
; spiffs,   data, spiffs,  ,        1M,
; coredump, data, coredump,,        0x40000,

; Monitor filters
monitor_filters = 
  esp32_exception_decoder
  time

; Test configuration
test_framework = unity
test_build_flags = -DUNITY_INCLUDE_CONFIG_H

; OTA configuration
upload_protocol = espota
upload_port = 192.168.1.100

; Debug (requires JTAG)
debug_tool = esp-prog
debug_init_break = tbreak setup